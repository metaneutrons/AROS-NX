# AROS-NX Declarative Target Profiles & Toolchain Configuration
# Modify versions, hardware targets, or download sources here without editing Rust code.
# Each target owns its MetaMake selectors; no removed CMake preset is inferred.

[host_compiler]
llvm_version = "18.1.8"
base_url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}"

[host_compiler.hosts.macos-aarch64]
asset = "clang+llvm-{version}-arm64-apple-macos11.tar.xz"

[host_compiler.hosts.macos-x86_64]
asset = "clang+llvm-{version}-x86_64-apple-darwin.tar.xz"

[host_compiler.hosts.linux-x86_64]
asset = "clang+llvm-{version}-x86_64-linux-gnu-ubuntu-18.04.tar.xz"

[host_compiler.hosts.linux-aarch64]
asset = "clang+llvm-{version}-aarch64-linux-gnu.tar.xz"

[[targets]]
name = "pc-x86_64"
sdk_consumer_contract = "compiler/sdk/pc-x86_64/consumer-v1.json"
arch = "x86_64"
platform = "pc"
bsp = "generic"
features = ["smp", "acpi", "hdaudio", "ahci"]

[targets.bootstrap_abi]
flavour = "standalone"
platform_smp = true

[targets.transpiler]
family = ""
variant = ""
toolchain = "llvm"
cpu32 = "i386"
use_mmu = true
mesa_version = "26.0.0"

[[targets]]
name = "rpi-aarch64"
sdk_consumer_contract = "compiler/sdk/rpi-aarch64/consumer-v1.json"
arch = "aarch64"
platform = "raspi"
bsp = "bcm2711-bcm2712"
features = ["smp", "genet", "rp1", "i2s", "hdmi-audio"]

[targets.bootstrap_abi]
flavour = "standalone"
platform_smp = true

[targets.transpiler]
family = ""
variant = ""
toolchain = "llvm"
cpu32 = ""
use_mmu = true
mesa_version = "26.0.0"

[[targets]]
name = "arm-raspi"
sdk_consumer_contract = "compiler/sdk/arm-raspi/consumer-v1.json"
arch = "arm"
platform = "raspi"
bsp = "bcm2835"
features = ["pwm-audio", "sdhost"]
float_abi = "hard"

[targets.bootstrap_abi]
flavour = "standalone"
platform_smp = true

[targets.transpiler]
family = ""
variant = ""
toolchain = "llvm"
cpu32 = ""
use_mmu = true
mesa_version = "26.0.0"

[[targets]]
name = "opensbi-riscv64"
arch = "riscv64"
platform = "opensbi"
bsp = "uefi-opensbi"
features = ["smp", "uefi", "acpi", "pci", "nvme", "xhci"]

[targets.transpiler]
family = ""
variant = ""
toolchain = "llvm"
cpu32 = ""
use_mmu = true
mesa_version = "26.0.0"

# The source SDK preset and compiler package profile have separate identities.
# This contract requires native-consumer support in a qualified tools runtime.
[[targets]]
name = "esp32p4-riscv-gnu"
toolchain_profile = "rv32-esp32p4"
native_consumer_contract = "arch/riscv-esp32p4/native-sdk/consumer-v2.json"
arch = "riscv32"
platform = "esp32p4"
bsp = "generic"
features = ["smp"]
float_abi = "ilp32f"

[targets.bootstrap_abi]
flavour = "standalone"
platform_smp = true

[targets.transpiler]
family = ""
variant = "smp"
toolchain = "gnu"
cpu32 = ""
use_mmu = false
mesa_version = "26.0.0"
