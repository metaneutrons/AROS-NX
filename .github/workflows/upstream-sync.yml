name: Propose upstream sync

on:
  schedule:
    - cron: '17 4 * * *'
  # Unlike workflow_dispatch, repository_dispatch always runs the workflow
  # from the default branch, not from an operator-selected ref.
  repository_dispatch:
    types: [propose-upstream-sync]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'metaneutrons/AROS-NX' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the dedicated sync credential
        env:
          SYNC_TOKEN: ${{ secrets.AROS_SYNC_TOKEN }}
        run: |
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo '::error::AROS_SYNC_TOKEN is not configured.'
            echo 'A dedicated fine-grained credential is required so the created pull request triggers normal CI.'
            exit 64
          fi

      - name: Checkout AROS-NX main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and validate upstream
        id: sync
        env:
          REPOSITORY: ${{ github.repository }}
          SYNC_TOKEN: ${{ secrets.AROS_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/aros-development-team/AROS.git
          git fetch --no-tags origin main master '+refs/heads/sync/*:refs/remotes/origin/sync/*'
          git fetch --no-tags upstream master

          old_master=$(git rev-parse origin/master)
          new_master=$(git rev-parse upstream/master)
          printf 'Current mirror: %s\nUpstream head: %s\n' "$old_master" "$new_master"

          if ! git merge-base --is-ancestor "$old_master" "$new_master"; then
            echo '::error::Upstream master is not a fast-forward of the AROS-NX mirror.'
            echo 'Refusing to rewrite master or guess how upstream history changed.'
            exit 65
          fi

          # Open integration PRs into main from this repository, automated
          # (sync/upstream-*) or manual (sync/manual-*). Each line: ref<TAB>sha.
          open_syncs=$(
            gh api --paginate "repos/${REPOSITORY}/pulls?state=open&base=main&per_page=100" |
              jq -r --arg repo "$REPOSITORY" \
                '.[] | select(.head.repo.full_name == $repo and (.head.ref | startswith("sync/"))) | "\(.head.ref)\t\(.head.sha)"'
          )

          pending() {
            {
              echo 'changed=pending'
              echo "branch=$1"
              echo "upstream_sha=$2"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # The mirror only advances together with a published integration
          # branch, so a mirror ahead of main is healthy exactly while an open
          # integration PR contains it.
          if ! git merge-base --is-ancestor "$old_master" origin/main; then
            while IFS=$'\t' read -r ref sha; do
              [ -n "$ref" ] || continue
              if git merge-base --is-ancestor "$old_master" "$sha" 2>/dev/null; then
                echo "Mirror ${old_master:0:12} is awaiting integration through ${ref}."
                pending "$ref" "$old_master"
              fi
            done <<< "$open_syncs"
            echo '::error::AROS-NX main does not contain the mirrored upstream head, and no open integration PR does.'
            echo 'Merge a sync branch containing the mirror into main; master never needs rewriting.'
            exit 66
          fi

          remote="https://x-access-token:${SYNC_TOKEN}@github.com/${REPOSITORY}.git"

          # A manually qualified integration may reach main before the mirror
          # advances. In that case only fast-forward the mirror; proposing an
          # empty PR would turn a healthy state into a scheduled failure.
          if git merge-base --is-ancestor "$new_master" origin/main; then
            if [ "$old_master" != "$new_master" ]; then
              git push "$remote" "${new_master}:refs/heads/master"
            fi
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One integration at a time: while any sync PR is open, a second
          # proposal would conflict with it or duplicate its resolutions.
          if [ -n "$open_syncs" ]; then
            ref=$(head -n1 <<< "$open_syncs" | cut -f1)
            echo "Upstream ${new_master:0:12} waits until the open integration PR (${ref}) is merged or closed."
            pending "$ref" "$old_master"
          fi

          short=${new_master:0:12}
          branch="sync/upstream-${short}"

          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "::error::Sync branch ${branch} already exists without an open pull request."
            echo 'Delete the stale branch or reopen its proposal; this workflow will never overwrite it.'
            exit 67
          fi

          git config user.name 'aros-nx-upstream-sync[bot]'
          git config user.email 'aros-nx-upstream-sync[bot]@users.noreply.github.com'

          git switch --create "$branch" origin/main
          # AROS-NX owns .github/: upstream changes there are discarded and
          # reported. Any other conflict aborts the merge (exit 68). Nothing has
          # been pushed at that point, so the mirror stays a valid base for the
          # next run or for a manual sync branch.
          report="${RUNNER_TEMP}/discarded-automation.md"
          conflicts="${RUNNER_TEMP}/conflicts.txt"
          if ! python3 scripts/ci/upstream_merge.py "$new_master" --report "$report" 2> "$conflicts"; then
            cat "$conflicts" >&2
            {
              echo '## Upstream sync'
              echo "Upstream \`${new_master}\` does not merge cleanly into main. Nothing was pushed; the mirror stays at \`${old_master}\`."
              echo
              echo "Integrate it manually on a \`sync/manual-${short}\` branch and open a PR into main."
              echo
              sed -n 's/^Conflict: /- /p' "$conflicts"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 68
          fi

          git push "$remote" "HEAD:refs/heads/${branch}"
          # The protected mirror accepts this push only as a fast-forward from
          # the dedicated sync identity. No force option is ever used. If it
          # fails, the branch is already published; the next run finds the
          # open PR or exits 67 for the stale branch instead of looping.
          git push "$remote" "${new_master}:refs/heads/master"

          {
            echo 'changed=true'
            echo "branch=${branch}"
            echo "upstream_sha=${new_master}"
            echo "report=${report}"
          } >> "$GITHUB_OUTPUT"

      - name: Open the integration pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AROS_SYNC_TOKEN }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          REPORT: ${{ steps.sync.outputs.report }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/pull-request-body.md"
          {
            printf "Automated fail-closed merge of upstream AROS master at \`%s\`.\n\n" "$UPSTREAM_SHA"
            cat <<'TEXT'
          Do not merge until all required AROS-NX qualification checks pass. The permanent `master` branch is the exact fast-forward mirror; this PR changes only `main`.
          TEXT
            if [ -s "$REPORT" ]; then
              printf '\n## Discarded upstream automation\n\n'
              cat "$REPORT"
            fi
          } > "$body"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "sync: integrate upstream ${UPSTREAM_SHA:0:12}" \
            --body-file "$body"

      - name: Record outcome
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: |
          {
            echo '## Upstream sync'
            if [ "$CHANGED" = 'true' ]; then
              echo "- Mirrored upstream commit: \`$UPSTREAM_SHA\`"
              echo "- Integration branch: \`$BRANCH\`"
              echo '- Merge remains gated by branch protection and required qualification jobs.'
            elif [ "$CHANGED" = 'pending' ]; then
              echo "- Mirror: \`$UPSTREAM_SHA\`"
              echo "- Open integration branch: \`$BRANCH\`"
              echo '- An integration pull request is still open; no new proposal until it is merged or closed.'
            else
              echo '- Upstream is integrated into main and the mirror equals upstream master.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
