##begin config
basename SDProof
version 1.0
libbase SDProofBase
libbasetype struct SDProofBase
residentpri -128
options noexpunge
##end config

##begin cdef
#include <exec/libraries.h>

/*
   The marker lives in the library base rather than in a static, because the
   base is what genmodule allocates and the initialisation fills in.  A caller
   reading this value back through a library call has therefore exercised the
   allocation, the initialisation and the jump table, not just the presence of
   some loaded code.
*/
struct SDProofBase
{
    struct Library  sdp_Library;
    ULONG           sdp_Marker;
    CONST_STRPTR    sdp_Id;
};
##end cdef

##begin functionlist
ULONG SDProofQuery(ULONG what) (D0)
##end functionlist
